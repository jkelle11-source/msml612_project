# =============================================================================
# Frozen project configuration — Missingness-Aware Diffusion Imputation (CSDI)
# =============================================================================
# These are the "decisions locked in" constants from PROJECT_PLAN.md §0 and the
# frozen experimental protocol (§3). Values here pin every model-vs-model
# comparison for the entire project. Treat changes as protocol changes, not
# config tweaks, and document any change in the report.

protocol:
  # -------------------------------------------------------------------------
  # FROZEN EvalMasker seed (PROJECT_PLAN §3.1, §4.1; M1-4 deliverable).
  # Seeds the ONE EvalMasker that holds out a fixed 10% of observed values as
  # evaluation targets, byte-identical across every model and every seed for
  # the whole project. Chosen value ties to the PhysioNet 2012 dataset and is
  # deliberately distinct from the run seeds (42-46) so eval-holdout RNG can
  # never be confused with per-run RNG.
  #
  # !!! DO NOT CHANGE. Changing it silently invalidates every comparison. !!!
  # Consumed by eval.EvalMasker (M1-3).
  eval_masker_seed: 2012

  # -------------------------------------------------------------------------
  # FROZEN BlockEvalMasker seed (PROJECT_PLAN §3.1, §4.1; M2-4).
  # Seeds the block-missingness holdout, frozen like EvalMasker's: one
  # generator per patient from (seed, record_id). Each patient loses the same
  # number of values as under EvalMasker (eval_holdout_fraction; there is no
  # block fraction of its own), hidden as whole block_window_hours windows
  # across all 35 features. Distinct from eval_masker_seed (2012),
  # eval_sampling_seed (2021), split_seed (612) and the run seeds (42-46).
  #
  # !!! DO NOT CHANGE. Changing it silently invalidates every block comparison. !!!
  # Consumed by eval.BlockEvalMasker (M2-4).
  block_eval_masker_seed: 8080

  # Length in hours of each hidden window: the 48-hour grid is tiled into
  # 48 / 3 = 16 fixed slots. Must divide data.n_timesteps.
  #
  # !!! DO NOT CHANGE. It decides which values the block holdout scores. !!!
  block_window_hours: 3

  # Fraction of observed values held out as the fixed evaluation target set
  # (the "10% masked" headline rate). PROJECT_PLAN §3.1, §6.
  eval_holdout_fraction: 0.10

  # CSDI's two robustness rates (PROJECT_PLAN §6): the same EvalMasker, same
  # eval_masker_seed, holding out 50% and 90% of observed values instead. Each
  # is a frozen holdout like the 10% one; the headline stays at 10%.
  # Consumed by eval.baselines (M2-3).
  robustness_fractions: [0.50, 0.90]

  # Imputations sampled per patient when scoring; the reported guess is their
  # median (eval.median_imputation, the lower-middle value as in upstream's
  # torch.median). 100 is upstream's evaluation default (exe_physio.py --nsample),
  # i.e. part of the published configuration the gate is measured against (§0).
  eval_n_samples: 100

  # FROZEN seed for the sampler's noise during evaluation (PROJECT_PLAN §3.3).
  # eval.EvalSampler re-seeds its generator with this at the start of every
  # evaluation pass, so a checkpoint's score depends on its weights alone and
  # every variant, run seed and epoch is scored with the same noise. Distinct
  # from eval_masker_seed (2012), split_seed (612), block_eval_masker_seed (8080),
  # and the run seeds (42-46).
  #
  # !!! DO NOT CHANGE once results exist. !!!
  eval_sampling_seed: 2021

  # Patients per sampler batch during evaluation; 16 is upstream's batch size.
  # Frozen together with the seed above: the noise a patient receives depends
  # on its position in the pass, so changing this changes every score slightly.
  eval_batch_size: 16

  # Paired 5-seed evaluation — common random numbers across all variants
  # (PROJECT_PLAN §3.3). Every variant is trained on these same seeds so each
  # variant-vs-base comparison is a paired difference.
  run_seeds: [42, 43, 44, 45, 46]

  # Reproduction gate: base CSDI must reach <= this MAE @10% averaged over >=3
  # seeds before any extension delta is trusted (PROJECT_PLAN §3.4).
  gate_mae_at_10pct: 0.24
  gate_min_seeds: 3

# -----------------------------------------------------------------------------
# Data grid (PhysioNet/CinC 2012 Set A). PROJECT_PLAN §1, M1-1.
# -----------------------------------------------------------------------------
data:
  n_timesteps: 48          # T: hourly grid over 48 hours
  n_features: 35           # D: vitals/labs, CSDI's 35 (37 time series minus MechVent, Weight)
  # Per-variable z-scoring uses TRAIN-SPLIT statistics only, applied to
  # val/test; MAE/RMSE reported in standardized units (PROJECT_PLAN §3.2).
  normalization: zscore_train_only

  # Seed for the fixed 70/10/20 patient-level train/val/test split (M1-1).
  # Deliberately distinct from eval_masker_seed (2012), block_eval_masker_seed
  # (8080) and the run seeds (42-46) so the kinds of randomness can never be
  # confused. It decides which patients are scored, so treat it as frozen once
  # results exist. Consumed by data.physionet.build_dataset.
  split_seed: 612

# -----------------------------------------------------------------------------
# Model / architecture invariants (PROJECT_PLAN §3.6).
# -----------------------------------------------------------------------------
model:
  # Fixed across the d_model in {64,128,256} sweep so head_dim stays an integer
  # (8/16/32). 8 is upstream CSDI's value, so the gate run matches the published
  # configuration. State the rule so the ablation does not silently break.
  # This is the ONLY place the head count is set: models.build_model copies it
  # into upstream's diffusion.nheads, which is deliberately absent below.
  n_heads: 8
  d_model_sweep: [64, 128, 256]   # values of diffusion.channels (§3.6)

  # Upstream's side information (config/base.yaml at the pinned commit): time
  # embedding size, feature embedding size, conditional model. Upstream's
  # target_strategy is not set here: models.build_model always uses "external"
  # (conditioning masks from eval.TrainMasker, M2-1), because upstream's
  # "random" draws from the global RNGs and would break seed pairing (§3.3).
  timeemb: 128
  featureemb: 16
  is_unconditional: 0

  # Extension toggles (default off = reproduced base CSDI). PROJECT_PLAN §4.
  # Read once, by models.build_model, which builds the extension modules into
  # the model; the training loop never sees them (README, input-hook contract).
  use_mask_embedding: false   # Extension 1 (--use_mask_embedding)
  use_time_encoding: false    # Extension 2 (--use_time_encoding)

# -----------------------------------------------------------------------------
# Reused diffusion process and denoiser (PROJECT_PLAN §0, decision 1; M2-1).
# Upstream's published PhysioNet configuration (config/base.yaml at the pinned
# commit), the setup behind the paper's 0.217, which the gate is measured
# against (§3.4). Key names are upstream's so the block passes straight to
# models.csdi.CSDI_Physio. Departures from these values must be documented.
# -----------------------------------------------------------------------------
diffusion:
  layers: 4                     # residual layers in the denoiser
  channels: 64                  # = d_model; the §3.6 sweep varies it (model.d_model_sweep)
  diffusion_embedding_dim: 128
  schedule: quad                # beta_t = linspace(sqrt(beta_start), sqrt(beta_end), T)^2
  beta_start: 0.0001
  beta_end: 0.5
  num_steps: 50                 # diffusion steps T
  is_linear: false              # standard attention, not linear attention

# -----------------------------------------------------------------------------
# Optimisation (M2-1). Defaults are upstream's (config/base.yaml, utils.train);
# tuning on top of them is allowed but must be documented (M4-1).
#
# YAML: write floats with a decimal point. PyYAML reads `1e-3` as the STRING
# "1e-3"; `1.0e-3` is a float.
# -----------------------------------------------------------------------------
train:
  epochs: 200
  batch_size: 16
  lr: 1.0e-3                    # Adam
  weight_decay: 1.0e-6          # hardcoded in upstream's utils.train
  # MultiStepLR: lr is multiplied by lr_gamma at max(1, int(fraction * epochs)) for each
  # fraction, i.e. at epochs 150 and 180 of 200 (upstream's p1, p2). The max(1, ...) is ours:
  # upstream's int() is 0 for a 1-epoch run, which drops the lr before its first step.
  lr_milestones: [0.75, 0.9]
  lr_gamma: 0.1
  # Max gradient norm for clip_grad_norm_; null = no clipping, as upstream.
  # The norm is still computed every step so it can be logged (M3-1).
  clip_grad_norm: null
  # Upstream's itr_per_epoch (1.0e+8) never binds on PhysioNet, so it is left out.

# -----------------------------------------------------------------------------
# Validation while training (M3-1): diffusion.run scores the val split's
# EvalMasker targets (10%) every every_n_epochs epochs and on the last epoch.
# TRACKING ONLY, not the frozen protocol: the median of n_samples draws, with the
# frozen eval_sampling_seed, in batches of batch_size. Reported results use
# eval.EvalSampler.from_config() (eval_n_samples: 100, eval_batch_size: 16).
# Fewer draws make the median noisier, which raises MAE slightly, so a tracked
# MAE below forward fill is a conservative claim. Cost: one draw over the 400
# val patients is about 130 s on an Apple M-series GPU (MPS), at any batch size.
# -----------------------------------------------------------------------------
validation:
  every_n_epochs: 10
  n_samples: 5
  batch_size: 64

# -----------------------------------------------------------------------------
# Experiment tracking (M3-2). Where runs are logged, not how they train: not
# part of the protocol or of a run. diffusion.run reads it from this file and
# leaves it out of a run's saved config and wandb config. The entity is
# the shared wandb TEAM (not the organization, DATA612-org, which can't hold
# runs); the project is created by the first run logged to it.
# -----------------------------------------------------------------------------
tracking:
  wandb_entity: DATA612
  wandb_project: msml612-csdi
